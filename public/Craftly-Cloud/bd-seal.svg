<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="sealShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Outer Gold Rim -->
  <circle cx="50" cy="50" r="48" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
  <!-- Green Outer Circle -->
  <circle cx="50" cy="50" r="44" fill="#006A4E" filter="url(#sealShadow)" />
  <!-- Red Inner Circle -->
  <circle cx="50" cy="50" r="32" fill="#F42A41" />
  
  <!-- Jute Leaves at Top (Gold) -->
  <path d="M50 25 C49 20 50 18 50 18 C50 18 51 20 50 25 Z" fill="#F9D616" stroke="#F9D616" stroke-width="1.5" />
  <path d="M47 26 C43 22 41 21 41 21 C41 21 44 24 48 27 Z" fill="#F9D616" />
  <path d="M53 26 C57 22 59 21 59 21 C59 21 56 24 52 27 Z" fill="#F9D616" />

  <!-- Four Stars (2 on each side of jute leaves) -->
  <!-- Left Stars -->
  <polygon points="34,22 35.2,25.5 38.5,25.5 35.8,27.5 36.8,31 34,28.8 31.2,31 32.2,27.5 29.5,25.5 32.8,25.5" fill="#F9D616" transform="scale(0.55) translate(28, 12)" />
  <polygon points="41,21 42.2,24.5 45.5,24.5 42.8,26.5 43.8,30 41,27.8 38.2,30 39.2,26.5 36.5,24.5 39.8,24.5" fill="#F9D616" transform="scale(0.55) translate(38, 12)" />
  <!-- Right Stars -->
  <polygon points="59,21 60.2,24.5 63.5,24.5 60.8,26.5 61.8,30 59,27.8 56.2,30 57.2,26.5 54.5,24.5 57.8,24.5" fill="#F9D616" transform="scale(0.55) translate(46, 12)" />
  <polygon points="66,22 67.2,25.5 70.5,25.5 67.8,27.5 68.8,31 66,28.8 63.2,31 64.2,27.5 61.5,25.5 64.8,25.5" fill="#F9D616" transform="scale(0.55) translate(56, 12)" />

  <!-- Water Lily (Shapla) in center (Gold / White) -->
  <g fill="#F9D616" stroke="#F9D616" stroke-linejoin="round">
    <!-- Center petal -->
    <path d="M50 36 C47 43 47 49 50 51 C53 49 53 43 50 36 Z" />
    <!-- Left petals -->
    <path d="M49 40 C43 42 39 46 41 51 C45 50 48 47 49 45 Z" />
    <path d="M48 45 C41 46 36 50 37 54 C42 54 46 51 48 49 Z" />
    <!-- Right petals -->
    <path d="M51 40 C57 42 61 46 59 51 C55 50 52 47 51 45 Z" />
    <path d="M52 45 C59 46 64 50 63 54 C58 54 54 51 52 49 Z" />
  </g>

  <!-- Water waves beneath lily -->
  <path d="M35 57 Q42 55 50 57 T65 57" fill="none" stroke="#F9D616" stroke-width="1.8" stroke-linecap="round" />
  <path d="M38 61 Q44 59 50 61 T62 61" fill="none" stroke="#F9D616" stroke-width="1.5" stroke-linecap="round" />

  <!-- Paddy (Rice) Sheaves flanking sides (Gold) -->
  <path d="M30 65 C26 55 27 40 32 32" fill="none" stroke="#F9D616" stroke-width="1.8" stroke-linecap="round" />
  <path d="M70 65 C74 55 73 40 68 32" fill="none" stroke="#F9D616" stroke-width="1.8" stroke-linecap="round" />
  <!-- Paddy grains -->
  <circle cx="28" cy="42" r="1.5" fill="#F9D616" />
  <circle cx="27" cy="48" r="1.5" fill="#F9D616" />
  <circle cx="27" cy="54" r="1.5" fill="#F9D616" />
  <circle cx="29" cy="60" r="1.5" fill="#F9D616" />
  <circle cx="72" cy="42" r="1.5" fill="#F9D616" />
  <circle cx="73" cy="48" r="1.5" fill="#F9D616" />
  <circle cx="73" cy="54" r="1.5" fill="#F9D616" />
  <circle cx="71" cy="60" r="1.5" fill="#F9D616" />
</svg>
