<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" stroke="currentColor">
  <!-- Isometric Stacked Compute Layers for University Students -->
  <g transform="translate(160, 100)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Layer 4 (Bottom) -->
    <g transform="translate(0, 36)" opacity="0.35">
      <polygon points="0,-22 55,0 0,22 -55,0" fill="none" stroke="currentColor" stroke-dasharray="3 3" />
      <line x1="-27" y1="-11" x2="28" y2="11" stroke="currentColor" stroke-dasharray="2 3" />
      <line x1="27" y1="-11" x2="-28" y2="11" stroke="currentColor" stroke-dasharray="2 3" />
    </g>

    <!-- Vertical connector lines -->
    <line x1="0" y1="36" x2="0" y2="-45" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.3" />
    <line x1="-55" y1="36" x2="-55" y2="-45" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.2" />
    <line x1="55" y1="36" x2="55" y2="-45" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.2" />

    <!-- Layer 3 -->
    <g transform="translate(0, 12)" opacity="0.55">
      <polygon points="0,-22 55,0 0,22 -55,0" fill="none" stroke="currentColor" />
      <!-- Internal grid lines -->
      <line x1="-36" y1="-7" x2="18" y2="15" stroke="currentColor" stroke-width="0.8" />
      <line x1="-18" y1="-15" x2="36" y2="7" stroke="currentColor" stroke-width="0.8" />
      <line x1="36" y1="-7" x2="-18" y2="15" stroke="currentColor" stroke-width="0.8" />
      <line x1="18" y1="-15" x2="-36" y2="7" stroke="currentColor" stroke-width="0.8" />
    </g>

    <!-- Layer 2 -->
    <g transform="translate(0, -12)" opacity="0.75">
      <polygon points="0,-22 55,0 0,22 -55,0" fill="none" stroke="currentColor" />
      <!-- Internal grid lines -->
      <line x1="-36" y1="-7" x2="18" y2="15" stroke="currentColor" stroke-width="0.9" />
      <line x1="-18" y1="-15" x2="36" y2="7" stroke="currentColor" stroke-width="0.9" />
      <line x1="36" y1="-7" x2="-18" y2="15" stroke="currentColor" stroke-width="0.9" />
      <line x1="18" y1="-15" x2="-36" y2="7" stroke="currentColor" stroke-width="0.9" />
    </g>

    <!-- Layer 1 (Top) -->
    <g transform="translate(0, -36)">
      <polygon points="0,-22 55,0 0,22 -55,0" fill="none" stroke="currentColor" stroke-width="1.4" />
      <!-- Internal grid lines -->
      <line x1="-36" y1="-7" x2="18" y2="15" stroke="currentColor" stroke-width="1" />
      <line x1="-18" y1="-15" x2="36" y2="7" stroke="currentColor" stroke-width="1" />
      <line x1="36" y1="-7" x2="-18" y2="15" stroke="currentColor" stroke-width="1" />
      <line x1="18" y1="-15" x2="-36" y2="7" stroke="currentColor" stroke-width="1" />
      
      <!-- Center node -->
      <circle cx="0" cy="0" r="2.5" fill="currentColor" />
    </g>
  </g>
</svg>
