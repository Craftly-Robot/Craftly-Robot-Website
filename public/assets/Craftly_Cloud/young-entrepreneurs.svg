<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" stroke="currentColor">
  <!-- Minimalist Lightbulb with Sprout for Young Entrepreneurs -->
  <g transform="translate(160, 100)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bulb Glass Outline -->
    <path d="M-36 -20 C-46 -4 0 25 -18 42 L-18 52 L18 52 L18 42 C0 25 46 -4 36 -20 C28 -38 -28 -38 -36 -20 Z" />
    
    <!-- Bulb Top Round Arc -->
    <path d="M-36 -20 C-44 -40 -20 -62 0 -62 C20 -62 44 -40 36 -20" />

    <!-- Bulb Screw Base Rings -->
    <line x1="-16" y1="58" x2="16" y2="58" stroke-width="1.2" />
    <line x1="-14" y1="64" x2="14" y2="64" stroke-width="1.2" />
    <path d="M-9 69 C-4 74 4 74 9 69" stroke-width="1.2" />

    <!-- Sprout inside the bulb -->
    <!-- Stem -->
    <path d="M0 45 C0 30 -2 15 2 -2 C4 -12 7 -22 6 -32" stroke-width="1.4" />
    
    <!-- Left Leaf -->
    <path d="M2 -2 C-12 -5 -18 -18 -8 -26 C-1 -22 1 -10 2 -2 Z" fill="currentColor" fill-opacity="0.15" stroke-width="1.2" />
    <!-- Leaf vein -->
    <path d="M2 -2 C-3 -10 -5 -18 -8 -26" stroke-width="0.8" opacity="0.6" />

    <!-- Right Leaf (higher up) -->
    <path d="M5 -16 C16 -18 24 -30 16 -38 C8 -36 6 -24 5 -16 Z" fill="currentColor" fill-opacity="0.15" stroke-width="1.2" />
    <!-- Leaf vein -->
    <path d="M5 -16 C10 -24 13 -30 16 -38" stroke-width="0.8" opacity="0.6" />
    
    <!-- Subtle glow/ambient rays -->
    <line x1="-50" y1="-30" x2="-58" y2="-34" stroke-width="1" opacity="0.4" />
    <line x1="-54" y1="-6" x2="-62" y2="-6" stroke-width="1" opacity="0.4" />
    <line x1="50" y1="-30" x2="58" y2="-34" stroke-width="1" opacity="0.4" />
    <line x1="54" y1="-6" x2="62" y2="-6" stroke-width="1" opacity="0.4" />
    <line x1="-28" y1="-62" x2="-34" y2="-70" stroke-width="1" opacity="0.4" />
    <line x1="28" y1="-62" x2="34" y2="-70" stroke-width="1" opacity="0.4" />
    <line x1="0" y1="-70" x2="0" y2="-78" stroke-width="1" opacity="0.4" />
  </g>
</svg>
