      <rect x="-18" y="-8" width="36" height="8" stroke-width="1" />
      
      <!-- Tower Pylon (A-Frame) -->
      <path d="M-10 -50 L-2 -160 L2 -160 L10 -50" stroke-width="2" />
      <line x1="-6" y1="-105" x2="6" y2="-105" stroke-width="1.5" />
      <line x1="-3" y1="-140" x2="3" y2="-140" stroke-width="1.2" />

      <!-- Stay Cables (Left & Right) -->
      <line x1="0" y1="-155" x2="-120" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
      <line x1="0" y1="-145" x2="-95" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
      <line x1="0" y1="-135" x2="-70" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
      <line x1="0" y1="-125" x2="-45" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
      <line x1="0" y1="-115" x2="-25" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />

      <line x1="0" y1="-155" x2="120" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
      <line x1="0" y1="-145" x2="95" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
      <line x1="0" y1="-135" x2="70" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
      <line x1="0" y1="-125" x2="45" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
      <line x1="0" y1="-115" x2="25" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
    </g>

    <!-- Pier / Pylons 2 -->
    <g transform="translate(120, 0)">
      <rect x="-14" y="-44" width="28" height="44" stroke-width="1.5" />
      <rect x="-18" y="-8" width="36" height="8" stroke-width="1" />
      
      <!-- Tower Pylon (A-Frame) -->
      <path d="M-10 -50 L-2 -160 L2 -160 L10 -50" stroke-width="2" />
      <line x1="-6" y1="-105" x2="6" y2="-105" stroke-width="1.5" />
      <line x1="-3" y1="-140" x2="3" y2="-140" stroke-width="1.2" />

      <!-- Stay Cables (Left & Right) -->
      <line x1="0" y1="-155" x2="-120" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
      <line x1="0" y1="-145" x2="-95" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
      <line x1="0" y1="-135" x2="-70" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
      <line x1="0" y1="-125" x2="-45" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
      <line x1="0" y1="-115" x2="-25" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />

      <line x1="0" y1="-155" x2="120" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
      <line x1="0" y1="-145" x2="95" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
      <line x1="0" y1="-135" x2="70" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
      <line x1="0" y1="-125" x2="45" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
      <line x1="0" y1="-115" x2="25" y2="-50" stroke-width="0.9" stroke-opacity="0.6" />
    </g>

    <!-- Additional Trees to the right of bridge -->
    <g transform="translate(255, 0)" stroke-opacity="0.35" stroke-width="1">
      <path d="M10 0 C6 -12 16 -20 26 -20 C36 -20 44 -12 40 0" />
      <path d="M45 0 L45 -25 M35 -25 C28 -35 40 -44 50 -44 C60 -44 70 -35 64 -25 Z" />
    </g>
  </g>
</svg>
