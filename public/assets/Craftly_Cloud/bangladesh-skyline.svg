<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Water/Ground Horizontal Baseline -->
  <line x1="40" y1="210" x2="1160" y2="210" stroke-opacity="0.25" stroke-width="1.5" />
  <line x1="80" y1="216" x2="1120" y2="216" stroke-opacity="0.15" stroke-dasharray="16 8" />
  <line x1="140" y1="222" x2="1060" y2="222" stroke-opacity="0.1" stroke-dasharray="24 12" />

  <!-- LEFT: Jatiya Smriti Soudho (National Martyrs' Memorial, Savar) -->
  <g transform="translate(190, 210)" stroke-opacity="0.8">
    <!-- Center spire pinnacle -->
    <line x1="0" y1="0" x2="0" y2="-170" stroke-width="1.8" />
    
    <!-- Outer ascending wall facets -->
    <path d="M-60 0 L-2 0 L-2 -170 L-60 0 Z" fill="none" />
    <path d="M60 0 L2 0 L2 -170 L60 0 Z" fill="none" />
    
    <path d="M-50 0 L-1.5 -165" />
    <path d="M50 0 L1.5 -165" />
    
    <path d="M-40 0 L-1 -155" />
    <path d="M40 0 L1 -155" />
    
    <path d="M-30 0 L-0.8 -140" />
    <path d="M30 0 L0.8 -140" />
    
    <path d="M-20 0 L-0.5 -115" />
    <path d="M20 0 L0.5 -115" />

    <path d="M-10 0 L-0.2 -80" />
    <path d="M10 0 L0.2 -80" />

    <!-- Horizontal step lines -->
    <line x1="-55" y1="-10" x2="55" y2="-10" stroke-opacity="0.4" />
    <line x1="-45" y1="-25" x2="45" y2="-25" stroke-opacity="0.4" />
    <line x1="-35" y1="-45" x2="35" y2="-45" stroke-opacity="0.4" />
    <line x1="-25" y1="-70" x2="25" y2="-70" stroke-opacity="0.4" />
    
    <!-- Base steps -->
    <rect x="-70" y="-3" width="140" height="3" stroke-width="1.2" />
    <rect x="-80" y="0" width="160" height="2" stroke-width="0.8" stroke-opacity="0.5" />
  </g>

  <!-- Trees / Greenery between landmarks -->
  <g transform="translate(300, 210)" stroke-opacity="0.4" stroke-width="1">
    <!-- Tree 1 -->
    <path d="M0 0 L0 -25 M-10 -25 C-15 -35 -5 -45 5 -45 C15 -45 20 -35 15 -25 C10 -20 -5 -20 -10 -25 Z" />
    <!-- Tree 2 -->
    <path d="M25 0 L25 -30 M15 -30 C10 -42 20 -52 30 -52 C40 -52 48 -42 42 -30 C35 -24 20 -24 15 -30 Z" />
    <!-- Bush -->
    <path d="M55 0 C50 -10 60 -18 70 -18 C80 -18 88 -10 85 0" />
    <path d="M85 0 C82 -14 92 -22 105 -22 C115 -22 125 -14 120 0" />
    <!-- Tree 3 -->
    <path d="M140 0 L140 -28 M130 -28 C122 -38 135 -48 145 -48 C155 -48 165 -38 158 -28 C150 -22 135 -22 130 -28 Z" />
  </g>

  <g transform="translate(480, 210)" stroke-opacity="0.35" stroke-width="1">
    <path d="M0 0 L0 -22 M-8 -22 C-14 -30 -4 -38 6 -38 C14 -38 20 -30 14 -22 Z" />
    <path d="M22 0 C18 -8 26 -14 34 -14 C42 -14 48 -8 46 0" />
    <path d="M60 0 L60 -32 M50 -32 C42 -44 55 -54 66 -54 C76 -54 86 -44 80 -32 Z" />
    <path d="M95 0 C90 -12 100 -20 110 -20 C120 -20 128 -12 125 0" />
  </g>

  <!-- RIGHT: Padma Bridge / Bangabandhu Cable-Stayed Bridge -->
  <g transform="translate(850, 210)" stroke-opacity="0.8">
