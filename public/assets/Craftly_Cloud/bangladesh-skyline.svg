    <line x1="-250" y1="-50" x2="250" y2="-50" stroke-width="2" />
    <line x1="-250" y1="-44" x2="250" y2="-44" stroke-width="1.2" stroke-opacity="0.5" />
    
    <!-- Truss under deck -->
    <path d="M-240 -44 L-225 -50 L-210 -44 L-195 -50 L-180 -44 L-165 -50 L-150 -44 L-135 -50 L-120 -44 L-105 -50 L-90 -44 L-75 -50 L-60 -44 L-45 -50 L-30 -44 L-15 -50 L0 -44 L15 -50 L30 -44 L45 -50 L60 -44 L75 -50 L90 -44 L105 -50 L120 -44 L135 -50 L150 -44 L165 -50 L180 -44 L195 -50 L210 -44 L225 -50 L240 -44" stroke-width="0.8" stroke-opacity="0.4" />

