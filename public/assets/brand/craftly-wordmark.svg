<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" role="img" aria-labelledby="title">
  <title id="title">Craftly</title>
  <defs>
    <filter id="white-to-black" x="-5%" y="-10%" width="110%" height="120%" color-interpolation-filters="sRGB">
      <feColorMatrix in="SourceGraphic" type="luminanceToAlpha" result="glyph-alpha" />
      <feFlood flood-color="#000" result="black" />
      <feComposite in="black" in2="glyph-alpha" operator="in" />
    </filter>
  </defs>
  <image
    href="data:image/jpeg;base64,"
    x="-80"
    y="-175"
    width="500"
    height="500"
    preserveAspectRatio="none"
    filter="url(#white-to-black)"
  />
</svg>
