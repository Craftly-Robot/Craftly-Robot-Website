<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none" aria-hidden="true" class="pv-network-svg">
  <defs>
    <style>
      .pv-net-dashed {
        stroke: var(--pv-net-dashed, #94a3b8);
        stroke-width: 2.2;
        stroke-dasharray: 8 6;
      }
      .pv-net-ring {
        stroke: var(--pv-net-ring, #cbd5e1);
        stroke-width: 2;
      }
      .pv-net-green-dot {
        fill: #22c55e;
      }
      .pv-net-cube-edge {
        stroke: var(--pv-net-cube, #0f172a);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .pv-net-cube-node {
        stroke: var(--pv-net-cube, #0f172a);
        stroke-width: 5;
        fill: var(--pv-net-node-bg, #ffffff);
      }
      @media (prefers-color-scheme: dark) {
        .pv-net-dashed {
          stroke: #475569;
        }
        .pv-net-ring {
          stroke: rgba(255, 255, 255, 0.18);
        }
        .pv-net-cube-edge,
        .pv-net-cube-node {
          stroke: #f1f5f9;
          fill: #0e1015;
        }
      }
      :root[data-theme="dark"] .pv-net-dashed,
      .dark .pv-net-dashed {
        --pv-net-dashed: #475569;
      }
      :root[data-theme="dark"] .pv-net-ring,
      .dark .pv-net-ring {
        --pv-net-ring: rgba(255, 255, 255, 0.18);
      }
      :root[data-theme="dark"] .pv-net-cube-edge,
      :root[data-theme="dark"] .pv-net-cube-node,
      .dark .pv-net-cube-edge,
      .dark .pv-net-cube-node {
        --pv-net-cube: #f1f5f9;
        --pv-net-node-bg: #0e1015;
      }
    </style>
  </defs>

  <!-- Dashed connector lines to left and right cards -->
  <g class="pv-net-dashed">
    <!-- Left Top -->
    <path d="M 0 240 L 240 240 C 285 240, 345 350, 379 400" />
    <!-- Left Mid -->
    <path d="M 0 497 L 333 497" />
    <!-- Left Bottom -->
    <path d="M 0 768 L 240 768 C 285 768, 345 666, 379 618" />

    <!-- Right Top -->
    <path d="M 1024 240 L 784 240 C 739 240, 679 350, 647 400" />
    <!-- Right Mid -->
    <path d="M 1024 497 L 691 497" />
    <!-- Right Bottom -->
    <path d="M 1024 768 L 784 768 C 739 768, 679 666, 647 618" />
  </g>

  <!-- Outer Orbit Ring -->
  <circle cx="513" cy="508" r="168" class="pv-net-ring" />

  <!-- Green Node Indicator Dots -->
  <g class="pv-net-green-dot">
    <circle cx="379" cy="400" r="7" />
    <circle cx="333" cy="497" r="7" />
    <circle cx="379" cy="618" r="7" />
    <circle cx="647" cy="400" r="7" />
    <circle cx="691" cy="497" r="7" />
    <circle cx="647" cy="618" r="7" />
  </g>

  <!-- Isometric 3D Cube Edges -->
  <g class="pv-net-cube-edge">
    <!-- Perimeter Hexagon -->
    <line x1="513" y1="419" x2="436" y2="464" />
    <line x1="436" y1="464" x2="436" y2="553" />
    <line x1="436" y1="553" x2="513" y2="598" />
    <line x1="513" y1="598" x2="590" y2="553" />
    <line x1="590" y1="553" x2="590" y2="464" />
    <line x1="590" y1="464" x2="513" y2="419" />

    <!-- Inner Y meeting at center -->
    <line x1="436" y1="464" x2="513" y2="508" />
    <line x1="590" y1="464" x2="513" y2="508" />
    <line x1="513" y1="508" x2="513" y2="598" />
  </g>

  <!-- Cube Vertices (Rings) -->
  <g class="pv-net-cube-node">
    <circle cx="513" cy="419" r="13" />
    <circle cx="436" cy="464" r="13" />
    <circle cx="590" cy="464" r="13" />
    <circle cx="436" cy="553" r="13" />
    <circle cx="590" cy="553" r="13" />
    <circle cx="513" cy="598" r="13" />
  </g>
</svg>